# pnpm 11+ settings (pnpm no longer reads these from .npmrc).
# Build scripts are denied for packages that work without them.
allowBuilds:
  sharp: false
  unrs-resolver: false
  # tsx (used by scripts/check-content.ts) works through esbuild's optional
  # platform packages; its postinstall is only a download fallback.
  esbuild: false
