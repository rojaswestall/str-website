name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Content, lint, typecheck, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Content is parsed before anything builds; a bad value fails here with
      # the zod message rather than inside `next build`.
      - name: Check content
        run: pnpm check:content

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # Runs `next typegen` first, then `tsc --noEmit`.
      - name: Typecheck
        run: pnpm typecheck

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Playwright's two web servers each run `pnpm build` (stub and live) and
      # pipe the build log in CI, so there is no separate build step; a build
      # failure fails this step with the Next error in the log.
      - name: Build and run end-to-end tests
        run: pnpm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
